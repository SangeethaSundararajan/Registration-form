<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrance Exam Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h3>Entrance Exam Registration Form</h3>
        </div>

        <div class="card-body">
            <form>

                <!-- Personal Details -->
                <h5 class="mb-3">Personal Details</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Date of Birth</label>
                        <input type="date" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter phone number" required>
                    </div>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label>Gender</label><br>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender" class="ms-3"> Female
                    <input type="radio" name="gender" class="ms-3"> Other
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label>Address</label>
                    <textarea class="form-control" rows="3" placeholder="Enter address"></textarea>
                </div>

                <!-- Educational Details -->
                <h5 class="mt-4 mb-3">Educational Details</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Qualification</label>
                        <select class="form-select">
                            <option>Select</option>
                            <option>12th Pass</option>
                            <option>Diploma</option>
                            <option>Graduate</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Marks (%)</label>
                        <input type="number" class="form-control" placeholder="Enter percentage">
                    </div>
                </div>

                <!-- Exam Details -->
                <h5 class="mt-4 mb-3">Exam Details</h5>
                <div class="mb-3">
                    <label>Choose Exam Center</label>
                    <select class="form-select">
                        <option>Select Center</option>
                        <option>Chennai</option>
                        <option>Bangalore</option>
                        <option>Hyderabad</option>
                        <option>Delhi</option>
                    </select>
                </div>

                <!-- Upload -->
                <div class="mb-3">
                    <label>Upload Photo</label>
                    <input type="file" class="form-control">
                </div>

                <!-- Terms -->
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" required>
                    <label class="form-check-label">I agree to the terms and conditions</label>
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-success">Register</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
